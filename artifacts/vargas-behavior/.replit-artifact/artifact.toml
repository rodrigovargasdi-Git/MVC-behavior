kind = "web"
previewPath = "/"
title = "Vargas Human Behavior"
description = "A premium, human-centered consultancy website for Marija Vargas, serving neurodivergent children and families, therapists, institutions, and Jugendämter across Germany."
version = "1.0.0"
id = "artifacts/vargas-behavior"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21815

[services.development]
run = "pnpm --filter @workspace/vargas-behavior run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vargas-behavior", "run", "build" ]
serve = "static"
publicDir = "artifacts/vargas-behavior/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21815"
BASE_PATH = "/"
